<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anomaly Detection System Mockup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-black: #1a1a1a;
            --text-dark: #333333;
            --text-light: #666666;
            --text-lighter: #999999;
            --bg-light: #f5f5f5;
            --bg-lighter: #fafafa;
            --border-color: #e0e0e0;
            --accent-dark: #4a5568;
            --alert-red: #d32f2f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            padding: 20px;
        }

        .system {
            max-width: 600px;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        .system-title {
            font-family: 'Fraunces', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-black);
            margin-bottom: 0.4rem;
        }

        .system-subtitle {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 1.5rem;
        }

        /* Status Cards */
        .status-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .status-card {
            background-color: var(--bg-light);
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid var(--border-color);
        }

        .status-label {
            font-size: 0.75rem;
            color: var(--text-light);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 0.6rem;
        }

        .status-value {
            font-family: 'Inter', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-black);
            margin-bottom: 0.4rem;
        }

        .status-note {
            font-size: 0.7rem;
            color: var(--text-lighter);
        }

        /* Chart Section */
        .chart-section {
            margin-bottom: 2rem;
        }

        .chart-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 1rem;
        }

        .chart-container {
            background-color: var(--bg-lighter);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1rem;
            font-size: 0.8rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .legend-box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        /* Alert Section */
        .alert-section {
            background-color: rgba(211, 47, 47, 0.05);
            border-left: 4px solid var(--alert-red);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .alert-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--alert-red);
            margin-bottom: 0.4rem;
        }

        .alert-content {
            font-size: 0.8rem;
            color: var(--text-dark);
            line-height: 1.5;
        }

        /* Detection Highlights */
        .highlights-section {
            background-color: var(--bg-light);
            border-radius: 8px;
            padding: 1.2rem;
        }

        .highlights-label {
            font-size: 0.75rem;
            color: var(--text-light);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 0.8rem;
        }

        .highlight-item {
            font-size: 0.85rem;
            color: var(--text-dark);
            margin-bottom: 0.8rem;
            display: flex;
            gap: 0.6rem;
        }

        .highlight-item:last-child {
            margin-bottom: 0;
        }

        .highlight-icon {
            color: var(--alert-red);
            font-weight: 700;
            min-width: 1.2rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .system {
                padding: 16px;
            }

            .status-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="system">
        <!-- Title -->
        <div>
            <div class="system-title">Anomaly Detection System</div>
            <div class="system-subtitle">Real-time monitoring & weekly alerts</div>
        </div>

        <!-- Time Series Chart -->
        <div class="chart-section">
            <div class="chart-container">
                <svg viewBox="0 0 500 200" preserveAspectRatio="xMidYMid meet">
                    <!-- Y-axis -->
                    <line x1="40" y1="20" x2="40" y2="170" stroke="#333333" stroke-width="1.5"/>
                    <!-- X-axis -->
                    <line x1="40" y1="170" x2="480" y2="170" stroke="#333333" stroke-width="1.5"/>

                    <!-- Grid lines -->
                    <line x1="40" y1="130" x2="480" y2="130" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="2,2"/>
                    <line x1="40" y1="90" x2="480" y2="90" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="2,2"/>
                    <line x1="40" y1="50" x2="480" y2="50" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="2,2"/>

                    <!-- Normal traffic line (baseline with confidence interval band) -->
                    <polyline
                        points="60,110 80,100 100,105 120,95 140,100 160,105 180,100 200,110 220,95 240,100 260,105 280,100 300,110 320,95 340,100 360,105 380,100 400,110 420,105 440,100 460,110"
                        fill="none"
                        stroke="#4a5568"
                        stroke-width="2.5"
                    />

                    <!-- Upper confidence interval band -->
                    <polyline
                        points="60,95 80,85 100,90 120,80 140,85 160,90 180,85 200,95 220,80 240,85 260,90 280,85 300,95 320,80 340,85 360,90 380,85 400,95 420,90 440,85 460,95"
                        fill="none"
                        stroke="#4a5568"
                        stroke-width="1"
                        stroke-dasharray="3,3"
                        opacity="0.4"
                    />

                    <!-- Lower confidence interval band -->
                    <polyline
                        points="60,125 80,115 100,120 120,110 140,115 160,120 180,115 200,125 220,110 240,115 260,120 280,115 300,125 320,110 340,115 360,120 380,115 400,125 420,120 440,115 460,125"
                        fill="none"
                        stroke="#4a5568"
                        stroke-width="1"
                        stroke-dasharray="3,3"
                        opacity="0.4"
                    />

                    <!-- Confidence interval shaded area -->
                    <polygon
                        points="60,95 60,125 80,85 80,115 100,90 100,120 120,80 120,110 140,85 140,115 160,90 160,120 180,85 180,115 200,95 200,125 220,80 220,110 240,85 240,115 260,90 260,120 280,85 280,115 300,95 300,125 320,80 320,110 340,85 340,115 360,90 360,120 380,85 380,115 400,95 400,125 420,90 420,120 440,85 440,115 460,95 460,125"
                        fill="#4a5568"
                        opacity="0.08"
                    />

                    <!-- Anomaly 1: Spike (bot traffic) -->
                    <polyline
                        points="300,110 320,45 340,110"
                        fill="none"
                        stroke="#d32f2f"
                        stroke-width="2.5"
                    />
                    <circle cx="320" cy="45" r="4" fill="#d32f2f"/>
                    <text x="315" y="35" font-family="Inter" font-size="10" fill="#d32f2f" font-weight="600">Bot Spike</text>

                    <!-- Anomaly 2: Drop (tracking break) -->
                    <polyline
                        points="380,110 400,150 420,150"
                        fill="none"
                        stroke="#d32f2f"
                        stroke-width="2.5"
                    />
                    <circle cx="400" cy="150" r="4" fill="#d32f2f"/>
                    <circle cx="420" cy="150" r="4" fill="#d32f2f"/>
                    <text x="390" y="165" font-family="Inter" font-size="10" fill="#d32f2f" font-weight="600">Tracking Break</text>

                    <!-- Axis labels -->
                    <text x="15" y="50" font-family="Inter" font-size="9" fill="#999999" text-anchor="end">High</text>
                    <text x="15" y="130" font-family="Inter" font-size="9" fill="#999999" text-anchor="end">Low</text>
                    <text x="250" y="190" font-family="Inter" font-size="9" fill="#666666" text-anchor="middle">Time (weeks)</text>
                </svg>
            </div>

            <div class="chart-legend">
                <div class="legend-item">
                    <div class="legend-box" style="background-color: #4a5568;"></div>
                    <span>Normal Traffic</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background-color: #4a5568; opacity: 0.08; border: 1px solid #4a5568;"></div>
                    <span>Expected Range</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box" style="background-color: #d32f2f;"></div>
                    <span>Anomaly</span>
                </div>
            </div>
        </div>

        <!-- Alert Example -->
        <div class="alert-section">
            <div class="alert-title">⚠️ Recent Detection Example</div>
            <div class="alert-content">
                Server-side tracking break flagged automatically — data collection gap detected and reported to client before they noticed, enabling proactive remediation.
            </div>
        </div>
    </div>
</body>
</html>
