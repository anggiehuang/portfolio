<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRO Analysis - Slide 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-black: #1a1a1a;
            --text-dark: #333333;
            --text-light: #666666;
            --text-lighter: #999999;
            --bg-light: #f5f5f5;
            --bg-lighter: #fafafa;
            --border-color: #e0e0e0;
            --accent-dark: #4a5568;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            padding: 20px;
        }

        .slide {
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 40px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .slide-header {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .slide-section-label {
            font-size: 0.75rem;
            color: var(--text-light);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .slide-title {
            font-family: 'Fraunces', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-black);
        }

        .slide-subtitle {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-top: 0.5rem;
        }

        .slide-bullets {
            list-style: none;
            padding: 0;
            margin-top: 0.8rem;
            font-size: 0.9rem;
            color: var(--text-light);
            line-height: 1.6;
        }

        .slide-bullets li {
            padding-left: 1.2rem;
            position: relative;
            margin-bottom: 0.4rem;
        }

        .slide-bullets li:before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--accent-dark);
        }

        .chart-container {
            flex: 1;
            background-color: var(--bg-lighter);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 300px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .slide {
                padding: 30px;
                gap: 1.5rem;
            }

            .slide-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="slide">
        <div class="slide-header">
            <p class="slide-section-label">Channel Performance Analysis</p>
            <h1 class="slide-title">Engagement & Conversion Trends</h1>
            <ul class="slide-bullets">
                <li>Revenue held steady while spend declined significantly across channels</li>
                <li>Engagement patterns reveal where optimization efforts would have highest ROI</li>
            </ul>
        </div>

        <div class="chart-container">
            <svg viewBox="0 0 700 300" preserveAspectRatio="xMidYMid meet">
                <!-- Axes -->
                <line x1="50" y1="20" x2="50" y2="240" stroke="#333333" stroke-width="1.5"/>
                <line x1="50" y1="240" x2="680" y2="240" stroke="#333333" stroke-width="1.5"/>

                <!-- Grid lines -->
                <line x1="50" y1="180" x2="680" y2="180" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="2,2"/>
                <line x1="50" y1="120" x2="680" y2="120" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="2,2"/>
                <line x1="50" y1="60" x2="680" y2="60" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="2,2"/>

                <!-- Bars (Orders) -->
                <rect x="80" y="200" width="25" height="40" fill="#4a5568" opacity="0.3"/>
                <rect x="120" y="195" width="25" height="45" fill="#4a5568" opacity="0.3"/>
                <rect x="160" y="185" width="25" height="55" fill="#4a5568" opacity="0.3"/>
                <rect x="200" y="170" width="25" height="70" fill="#4a5568" opacity="0.3"/>
                <rect x="240" y="160" width="25" height="80" fill="#4a5568" opacity="0.3"/>
                <rect x="280" y="140" width="25" height="100" fill="#4a5568" opacity="0.3"/>
                <rect x="320" y="100" width="25" height="140" fill="#4a5568" opacity="0.3"/>
                <rect x="360" y="110" width="25" height="130" fill="#4a5568" opacity="0.3"/>
                <rect x="400" y="130" width="25" height="110" fill="#4a5568" opacity="0.3"/>
                <rect x="440" y="145" width="25" height="95" fill="#4a5568" opacity="0.3"/>
                <rect x="480" y="160" width="25" height="80" fill="#4a5568" opacity="0.3"/>
                <rect x="520" y="175" width="25" height="65" fill="#4a5568" opacity="0.3"/>
                <rect x="560" y="190" width="25" height="50" fill="#4a5568" opacity="0.3"/>
                <rect x="600" y="205" width="25" height="35" fill="#4a5568" opacity="0.3"/>
                <rect x="640" y="215" width="25" height="25" fill="#4a5568" opacity="0.3"/>

                <!-- Line 1: Revenue (yellow/gold) -->
                <polyline
                    points="92,180 132,170 172,160 212,150 252,145 292,140 332,120 372,125 412,135 452,145 492,155 532,165 572,175 612,185 652,195"
                    fill="none"
                    stroke="#d4a574"
                    stroke-width="2.5"
                />

                <!-- Line 2: Spend (dark grey) -->
                <polyline
                    points="92,90 132,95 172,100 212,120 252,135 292,160 332,210 372,200 412,180 452,160 492,140 532,125 572,110 612,95 652,80"
                    fill="none"
                    stroke="#4a5568"
                    stroke-width="2.5"
                />

                <!-- Legend -->
                <rect x="80" y="255" width="12" height="12" fill="#4a5568" opacity="0.3"/>
                <text x="100" y="265" font-family="Inter" font-size="12" fill="#333333">Orders</text>

                <line x1="250" y1="261" x2="270" y2="261" stroke="#d4a574" stroke-width="2.5"/>
                <text x="280" y="265" font-family="Inter" font-size="12" fill="#333333">Revenue</text>

                <line x1="420" y1="261" x2="440" y2="261" stroke="#4a5568" stroke-width="2.5"/>
                <text x="450" y="265" font-family="Inter" font-size="12" fill="#333333">Spend</text>

                <!-- Axis labels -->
                <text x="30" y="65" font-family="Inter" font-size="11" fill="#999999" text-anchor="end">High</text>
                <text x="30" y="245" font-family="Inter" font-size="11" fill="#999999" text-anchor="end">Low</text>
                <text x="365" y="280" font-family="Inter" font-size="11" fill="#666666" text-anchor="middle">Time</text>
            </svg>
        </div>
    </div>
</body>
</html>
